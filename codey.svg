rect x="70" y="110" width="168.4" height="14" rx="7" fill="#7fe3c0"/><rect x="74" y="113" width="160.4" height="3" rx="1.5" fill="#fff" opacity="0.45"/><text x="318" y="121" text-anchor="end" font-size="11" fill="#ff7eb6">0.84</text>
  </g>

  <line x1="265" y1="254" x2="600" y2="254" stroke="#ffc46b" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round"/>

  <!-- activity -->
  <g transform="translate(267, 276)" font-size="13" fill="#6b4a8a">
    <text x="0" y="0" font-size="11" opacity="0.6">♪ 활동 기록</text>
    <text x="0" y="24">🔥 연속 2일  •  커밋 441</text>
    <text x="0" y="46">⭐ 진짜 별 686  •  별 인플레 176</text>
    <text x="0" y="68" fill="#3ec9a0" font-weight="700">💌 상태 = quality_curator</text>
    <text x="0" y="84" fill="#ff7eb6" font-size="10">이슈 해결:1 • 비율:0.17 • 점수:0.75</text>
    <text x="0" y="108" fill="#ff7eb6" font-weight="700">🌸 시즌=Year Push +1.25x 🍁</text>
  </g>

  <line x1="265" y1="414" x2="600" y2="414" stroke="#ffc46b" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round"/>

  <!-- footer -->
  <g transform="translate(265, 424)" fill="#6b4a8a">
    <text x="0" y="16" font-size="13" font-weight="700">♡ 오늘도 화이팅! 💀 👑 💎 🎯 🐛 <tspan class="cursor" fill="#ffc46b">▌</tspan></text>
  </g>
</svg>