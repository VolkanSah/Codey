text { font-family: 'JetBrains Mono','Fira Code','Courier New',monospace; }
@keyframes spin   { from { transform: translateX(0); } to { transform: translateX(-232px); } }
@keyframes mx     { from { transform: translateX(-110px); } to { transform: translateX(110px); } }
@keyframes my     { from { transform: translateY(-30px); } to { transform: translateY(30px); } }
@keyframes twinkle{ 0%,100% { opacity: .15; } 50% { opacity: 1; } }
@keyframes shoot  { 0%,82% { transform: translate(0,0); opacity: 0; }
                    84% { opacity: 1; }
                    96% { transform: translate(150px,60px); opacity: 0; }
                    100% { transform: translate(150px,60px); opacity: 0; } }
@keyframes bob    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes cur    { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
.tex   { animation: spin 40s linear infinite; }
.mx    { animation: mx 7s ease-in-out infinite alternate; }
.my    { animation: my 7s ease-in-out infinite alternate; animation-delay: -3.5s; }
.t1    { animation: twinkle 3s ease-in-out infinite; }
.t2    { animation: twinkle 3s ease-in-out infinite; animation-delay: -1.1s; }
.t3    { animation: twinkle 3s ease-in-out infinite; animation-delay: -2.2s; }
.shoot { animation: shoot 11s ease-in infinite; }
.bob   { animation: bob 3.4s ease-in-out infinite; }
.cursor{ animation: cur 1s step-end infinite; }
@media (prefers-reduced-motion: reduce) {
  .tex,.mx,.my,.t1,.t2,.t3,.shoot,.bob,.cursor { animation: none; }
}
</style>
